<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>DinkHub | Open Play Queue</title>
        <meta name="theme-color" content="#0b2a24" />
        <link rel="icon" type="image/png" sizes="32x32"
            href="../icons/favicon-32.png" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
tailwind.config = {
  theme: { extend: {
    colors: {
      court: { 900: "#0b2a24", 800: "#0f3a32", 700: "#14493f", 600: "#1b5e51" },
      optic: { DEFAULT: "#d7ff3f", dark: "#b9e01f" },
    },
    fontFamily: { display: ['"Bricolage Grotesque"', "sans-serif"], body: ['"DM Sans"', "sans-serif"] },
  } },
};
</script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <style>
  :root { --optic: #d7ff3f; }
  body { background: #0b2a24; font-feature-settings: "tnum"; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(215,255,63,.55); } 100% { box-shadow: 0 0 0 9px rgba(215,255,63,0); } }
  .pop { animation: pop .22s ease-out; }
  .live { animation: live 1.6s ease-out infinite; }

  /* The court: real proportions (20 x 44 ft), net in the middle, kitchens either side */
  .court { position: relative; aspect-ratio: 2 / 1; container-type: inline-size; }
  .court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot {
    position: absolute; transform: translate(-50%, -50%);
    width: 29%; display: flex; align-items: center; gap: 4px;
    padding: .4em .4em .4em .85em; border-radius: 999px; font-weight: 600; font-size: clamp(10.5px, 3.9cqw, 14px); line-height: 1.1;
  }
  .slot.filled { background: #0b2a24; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(215,255,63,.35); }
  .slot.open { border: 1.5px dashed rgba(255,255,255,.28); color: rgba(255,255,255,.4); justify-content: center; font-weight: 500; }
  .slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .slot button { flex: none; width: 22px; height: 22px; border-radius: 999px; color: rgba(255,255,255,.45); font-size: 10px; }
  .slot button:hover, .slot button:focus-visible { background: var(--optic); color: #0b2a24; }
  /* bigger tap targets on touch screens */
  @media (pointer: coarse) { .row-actions button { width: 36px; height: 36px; } .slot button { width: 26px; height: 26px; } }

  .seg { position: relative; }
  .seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 2); border-radius: 9px; background: var(--optic); transition: transform .28s cubic-bezier(.4, 0, .2, 1); }
  .seg[data-mode="stay"]::before, .seg[data-mode="fixed"]::before { transform: translateX(100%); }
  .seg button { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; font-weight: 600; font-size: 14px; border-radius: 9px; color: rgba(255,255,255,.65); white-space: nowrap; transition: color .28s; }
  .seg button[aria-pressed="true"] { color: #0b2a24; }
  @media (min-width: 640px) { .seg button { flex: none; width: 8rem; } }

  .row-actions button { width: 28px; height: 28px; border-radius: 8px; color: rgba(255,255,255,.45); font-size: 12px; }
  .row-actions button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .row-actions button.danger:hover { background: rgba(248,113,113,.15); color: #fca5a5; }

  /* Guided tour: only transform and opacity animate, so it stays on the GPU at 60fps */
  #tour { position: fixed; inset: 0; z-index: 80; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #tour.on { opacity: 1; }
  .tour-block { position: absolute; inset: 0; pointer-events: auto; }
  .tour-dim { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tour-dim path { fill: rgba(4,16,13,.8); }
  .tour-ring { position: absolute; left: 0; top: 0; border: 2px solid var(--optic); border-radius: 14px; will-change: transform, opacity; contain: layout style; }
  .tour-ring::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--optic); animation: tourPulse 1.8s ease-out infinite; }
  @keyframes tourPulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.05); opacity: 0; } }
  .tour-card { position: absolute; left: 0; top: 0; width: min(360px, calc(100vw - 24px)); background: #0f3a32; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 16px 18px 18px; box-shadow: 0 18px 50px rgba(0,0,0,.5); pointer-events: auto; will-change: transform; }
  .tour-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 14px; }
  .tour-bar i { display: block; height: 100%; background: var(--optic); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .tour-inner.swap { animation: tourSwap .34s cubic-bezier(.22,1,.36,1); }
  @keyframes tourSwap { from { opacity: 0; transform: translate3d(var(--dx, 0px), 6px, 0); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tour-ring::after, .tour-inner.swap { animation: none; } .tour-bar i, #tour { transition: none; } }

  /* Results podium: transform and opacity only */
  @keyframes rkRise { from { transform: translate3d(0, 100%, 0); } to { transform: none; } }
  @keyframes rkIn { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: none; } }
  @keyframes rkConf { 0% { opacity: 0; transform: translate3d(0, -16px, 0) rotate(0); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate3d(var(--x), 250px, 0) rotate(var(--r)); } }
  @keyframes rkPulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.35); opacity: 0; } }
  .rk-rise { animation: rkRise .75s cubic-bezier(.22,1,.36,1) both; will-change: transform; }
  .rk-fade { animation: rkIn .55s cubic-bezier(.22,1,.36,1) both; }
  .rk-conf { position: absolute; top: 0; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: rkConf 2.6s ease-out both; }
  .rk-pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--optic); animation: rkPulse 2s ease-out .9s infinite; }
  @media (prefers-reduced-motion: reduce) { .rk-rise, .rk-fade, .rk-pulse::after { animation: none !important; } .rk-conf { display: none; } }

  :focus-visible { outline: 2px solid var(--optic); outline-offset: 2px; }
  input::placeholder { color: rgba(255,255,255,.38); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #1b5e51; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .pop, .live { animation: none !important; } .seg::before, .seg button { transition: none; } }
</style>
    </head>
    <body id="top" class="font-body text-white min-h-screen antialiased">

        <header class="border-b border-white/10">
            <div
                class="mx-auto flex max-w-[1400px] items-center justify-between gap-2 px-4 pb-3 pt-[max(0.75rem,env(safe-area-inset-top))] sm:gap-3 sm:px-6">

                <!-- Brand -->
                <div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-3">
                    <a href="../index.html"
                        class="flex h-10 shrink-0 items-center gap-2 rounded-xl bg-white/5 px-3 text-sm font-semibold hover:bg-white/10"
                        aria-label="Back to DinkHub"><i
                            class="fa-solid fa-arrow-left"></i><span
                            class="hidden sm:inline">Back</span></a>
                    <div
                        class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-optic text-court-900 min-[420px]:flex"><i
                            class="fa-solid fa-table-tennis-paddle-ball"></i></div>
                    <div class="min-w-0 leading-tight">
                        <h1
                            class="truncate font-display text-xl font-extrabold">Dink<span
                                class="text-optic">Hub</span></h1>
                        <p class="truncate text-xs text-white/55">Open play</p>
                    </div>
                </div>

                <!-- Actions: icon-only on phones, "Complete Open Play" label from sm up -->
                <div class="flex shrink-0 items-center gap-2">
                    <button data-a="finish" title="Complete Open Play" aria-label="Complete Open Play"
                        class="flex h-10 min-w-10 items-center justify-center rounded-xl border border-optic/50 px-2.5 text-sm font-bold text-optic hover:bg-optic hover:text-court-900 sm:px-4"><i
                            class="fa-solid fa-flag-checkered"></i><span
                            class="ml-2 hidden whitespace-nowrap sm:inline">Complete Open Play</span></button>
                    <span id="clock"
                        class="num hidden font-display text-lg font-semibold text-white/80 md:inline">--:--</span>
                    <button id="btnTour"
                        class="flex h-10 items-center gap-2 rounded-xl bg-white/5 px-3 text-sm font-semibold hover:bg-white/10"
                        aria-label="Take a tour of this page"><i
                            class="fa-solid fa-circle-question"></i><span
                            class="hidden md:inline">Tour</span></button>
                    <button id="btnSettings"
                        class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/5 hover:bg-white/10"
                        aria-label="Settings"><i
                            class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </header>

        <main
            class="mx-auto max-w-[1400px] px-4 pb-[max(2rem,env(safe-area-inset-bottom))] pt-5 sm:px-6 sm:pt-6">

            <section
                class="overflow-hidden rounded-2xl border border-white/10 bg-court-800">
                <dl id="stats"
                    class="grid grid-cols-2 divide-x divide-white/10 border-b border-white/10 sm:grid-cols-4 [&>*:nth-child(n+3)]:border-t [&>*:nth-child(n+3)]:border-white/10 sm:[&>*:nth-child(n+3)]:border-t-0"></dl>
                <div
                    class="grid gap-3 p-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:p-4 xl:grid-cols-[minmax(0,1fr)_auto_auto_auto]">
                    <form id="addForm"
                        class="flex min-w-0 gap-2 sm:col-span-2 sm:gap-3 xl:col-span-1">
                        <label class="sr-only" for="names">Player names</label>
                        <input id="names" autocomplete="off"
                            placeholder="Add players: Marco, Ana, Jun"
                            class="h-12 min-w-0 flex-1 rounded-xl border border-white/15 bg-court-900 px-4 outline-none focus:border-optic" />
                        <button
                            class="h-12 shrink-0 rounded-xl bg-optic px-5 font-bold text-court-900 hover:bg-optic-dark sm:px-6"><i
                                class="fa-solid fa-plus mr-2"></i>Add</button>
                    </form>
                    <div
                        class="seg flex h-12 w-full shrink-0 rounded-xl border border-white/10 bg-court-900 p-1 sm:w-auto sm:justify-self-start"
                        role="group" aria-label="After a game">
                        <button data-a="mode" data-v="rotate"
                            aria-pressed="true">Rotate all</button>
                        <button data-a="mode" data-v="stay"
                            aria-pressed="false">Winners stay</button>
                    </div>
                    <div id="segPartner"
                        class="seg flex h-12 w-full shrink-0 rounded-xl border border-white/10 bg-court-900 p-1 sm:w-auto sm:justify-self-end xl:justify-self-start"
                        role="group" aria-label="Partners" data-mode="rotating">
                        <button data-a="partner" data-v="rotating"
                            aria-pressed="true">Rotating partner</button>
                        <button data-a="partner" data-v="fixed"
                            aria-pressed="false">Fixed partner</button>
                    </div>
                    <button id="btnFillAll" type="button" role="switch"
                        aria-checked="false"
                        title="When on, empty courts fill automatically from the queue, including right after a game ends"
                        class="flex h-12 w-full shrink-0 items-center justify-between gap-3 rounded-xl border border-white/15 px-4 text-sm font-bold text-white/70 sm:w-auto sm:justify-self-end">
                        <span>Auto-fill courts</span>
                        <span id="afTrack"
                            class="relative h-5 w-9 shrink-0 rounded-full bg-white/20 transition-colors"><span
                                id="afKnob"
                                class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition-transform"></span></span>
                    </button>
                </div>
            </section>

            <div
                class="mt-6 grid gap-6 sm:mt-8 sm:gap-8 lg:grid-cols-[minmax(0,1fr)_340px] xl:grid-cols-[minmax(0,1fr)_380px]">

                <!-- Courts -->
                <section id="sec-courts"
                    class="min-w-0 lg:col-start-1 lg:row-start-1">
                    <h2 class="sr-only">Courts</h2>
                    <div id="courts"
                        class="grid gap-4 sm:gap-5 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2"></div>
                </section>

                <!-- Queue -->
                <aside id="sec-queue"
                    class="min-w-0 lg:col-start-2 lg:row-span-3 lg:row-start-1 lg:self-start">
                    <div
                        class="rounded-2xl bg-court-800 p-4 sm:p-5">
                        <div class="flex items-baseline justify-between">
                            <h2
                                class="font-display text-2xl font-bold">Queue</h2>
                            <span id="queueCount"
                                class="num text-sm text-white/55"></span>
                        </div>
                        <div id="queueBody" class="mt-4"></div>
                        <div id="breakWrap" class="mt-6 hidden">
                            <h3
                                class="font-display text-base font-bold text-white/80">On
                                break</h3>
                            <ul id="breakList"
                                class="mt-2 divide-y divide-white/10"></ul>
                        </div>
                    </div>
                </aside>

                <!-- Finished games -->
                <div id="sec-log" class="min-w-0 lg:col-start-1 lg:row-start-2">
                    <div class="flex items-center justify-between">
                        <h2 class="font-display text-xl font-bold">Finished
                            games</h2>
                        <button id="btnClearLog"
                            class="px-1 py-1 text-sm text-white/55 hover:text-white">Clear</button>
                    </div>
                    <ul id="log"
                        class="mt-3 divide-y divide-white/10 border-y border-white/10 text-sm"></ul>
                </div>

                <!-- Leaderboard -->
                <div id="sec-leaderboard"
                    class="min-w-0 lg:col-start-1 lg:row-start-3">
                    <div class="rounded-2xl bg-court-800 p-4 sm:p-5">
                        <div class="flex items-baseline justify-between">
                            <h2 class="font-display text-xl font-bold"><i
                                    class="fa-solid fa-trophy mr-2 text-base text-optic"></i>Leaderboard</h2>
                            <span id="lbCount"
                                class="num text-sm text-white/55"></span>
                        </div>
                        <div id="lbBody" class="mt-4"></div>
                        <p
                            class="mt-3 text-xs leading-snug text-white/45">Ranked
                            by wins. On equal wins, fewer games played ranks
                            higher.</p>
                    </div>
                </div>
            </div>
        </main>

        <div id="modal"
            class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4"
            role="dialog" aria-modal="true">
            <div
                class="pop relative max-h-[92dvh] w-full max-w-md overflow-y-auto rounded-2xl border border-white/10 bg-court-800 p-5 sm:p-6"
                id="modalBody"></div>
        </div>
        <div id="toast" role="status"
            class="pointer-events-none fixed bottom-[max(1.25rem,env(safe-area-inset-bottom))] left-1/2 z-50 -translate-x-1/2 translate-y-10 rounded-full bg-optic px-4 py-2 text-sm font-bold text-court-900 opacity-0 transition-all"></div>

        <script src="dashboard.js"></script>
    </body>
</html>
