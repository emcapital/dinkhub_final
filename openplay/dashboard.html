        <style>
  :root { color-scheme: dark; --c900: 11 42 36; --c800: 15 58 50; --c700: 20 73 63; --c600: 27 94 81; --optic-rgb: 215 255 63; --optic-dk-rgb: 185 224 31; --fg: 255 255 255; --optic: rgb(var(--optic-rgb)); }
  html[data-theme="light"] { color-scheme: light; --c900: 243 247 238; --c800: 255 255 255; --c700: 232 240 227; --c600: 207 221 200; --optic-rgb: 23 96 79; --optic-dk-rgb: 17 77 63; --fg: 11 42 36; }
  body { background: rgb(var(--c900)); font-feature-settings: "tnum"; }
  /* no half-finished colour transitions while the theme spreads across the page */
  html.theme-switching *, html.theme-switching *::before, html.theme-switching *::after { transition: none !important; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; } ::view-transition-new(root) { z-index: 2; }
  /* theme toggle icons swap with a turn */
  #btnTheme i { position: absolute; transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .3s; }
  html[data-theme="dark"] #btnTheme .t-sun { transform: rotate(-90deg) scale(.3); opacity: 0; }
  html[data-theme="light"] #btnTheme .t-moon { transform: rotate(90deg) scale(.3); opacity: 0; }
  /* Phones: the header actions live in a slide-in sidebar (from sm up they are normal header buttons) */
  @media (max-width: 639px) {
    #navPanel { transform: translateX(-100%); visibility: hidden; transition: transform .3s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .3s; }
    #navPanel.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.22, 1, .36, 1), visibility 0s; box-shadow: 0 0 60px rgba(0, 0, 0, .5); }
  }
  @media (prefers-reduced-motion: reduce) { #navPanel { transition: none !important; } }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(215,255,63,.55); } 100% { box-shadow: 0 0 0 9px rgba(215,255,63,0); } }
  .pop { animation: pop .22s ease-out; }
  .live { animation: live 1.6s ease-out infinite; }

  /* The court: real proportions (20 x 44 ft), net in the middle, kitchens either side */
  .court { position: relative; aspect-ratio: 2 / 1; container-type: inline-size; }
  .court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot {
    position: absolute; transform: translate(-50%, -50%);
    width: 29%; display: flex; align-items: center; gap: 4px;
    padding: .4em .4em .4em .85em; border-radius: 999px; font-weight: 600; font-size: clamp(10.5px, 3.9cqw, 14px); line-height: 1.1;
  }
  .slot.filled { background: #0b2a24; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(215,255,63,.35); }
  .slot.open { border: 1.5px dashed rgba(255,255,255,.28); color: rgba(255,255,255,.4); justify-content: center; font-weight: 500; }
  .slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .slot button { flex: none; width: 22px; height: 22px; border-radius: 999px; color: rgba(255,255,255,.45); font-size: 10px; }
  .slot button:hover, .slot button:focus-visible { background: #d7ff3f; color: #0b2a24; }
  /* bigger tap targets on touch screens */
  @media (pointer: coarse) { .row-actions button { width: 36px; height: 36px; } .slot button { width: 26px; height: 26px; } }

  .seg { position: relative; }
  .seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 2); border-radius: 9px; background: var(--optic); transition: transform .28s cubic-bezier(.4, 0, .2, 1); }
  .seg[data-mode="stay"]::before, .seg[data-mode="fixed"]::before { transform: translateX(100%); }
  .seg button { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; font-weight: 600; font-size: 14px; border-radius: 9px; color: rgb(var(--fg) / .65); white-space: nowrap; transition: color .28s; }
  .seg button[aria-pressed="true"] { color: rgb(var(--c900)); }
  @media (min-width: 640px) { .seg button { flex: none; width: 8rem; } }

  .row-actions button { width: 28px; height: 28px; border-radius: 8px; color: rgb(var(--fg) / .45); font-size: 12px; }
  .row-actions button:hover { background: rgb(var(--fg) / .1); color: rgb(var(--fg)); }
  .row-actions button.danger:hover { background: rgba(248,113,113,.15); color: #fca5a5; }

  /* Guided tour: only transform and opacity animate, so it stays on the GPU at 60fps */
  #tour { position: fixed; inset: 0; z-index: 80; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #tour.on { opacity: 1; }
  .tour-block { position: absolute; inset: 0; pointer-events: auto; }
  .tour-dim { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tour-dim path { fill: rgba(4,16,13,.8); }
  .tour-ring { position: absolute; left: 0; top: 0; border: 2px solid var(--optic); border-radius: 14px; will-change: transform, opacity; contain: layout style; }
  .tour-ring::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--optic); animation: tourPulse 1.8s ease-out infinite; }
  @keyframes tourPulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.05); opacity: 0; } }
  .tour-card { position: absolute; left: 0; top: 0; width: min(360px, calc(100vw - 24px)); background: rgb(var(--c800)); border: 1px solid rgb(var(--fg) / .14); border-radius: 16px; padding: 16px 18px 18px; box-shadow: 0 18px 50px rgba(0,0,0,.5); pointer-events: auto; will-change: transform; }
  .tour-bar { height: 3px; border-radius: 2px; background: rgb(var(--fg) / .12); overflow: hidden; margin-bottom: 14px; }
  .tour-bar i { display: block; height: 100%; background: var(--optic); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .tour-inner.swap { animation: tourSwap .34s cubic-bezier(.22,1,.36,1); }
  @keyframes tourSwap { from { opacity: 0; transform: translate3d(var(--dx, 0px), 6px, 0); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tour-ring::after, .tour-inner.swap { animation: none; } .tour-bar i, #tour { transition: none; } }

  /* Results podium: transform and opacity only */
  @keyframes rkRise { from { transform: translate3d(0, 100%, 0); } to { transform: none; } }
  @keyframes rkIn { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: none; } }
  @keyframes rkConf { 0% { opacity: 0; transform: translate3d(0, -16px, 0) rotate(0); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate3d(var(--x), 250px, 0) rotate(var(--r)); } }
  @keyframes rkPulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.35); opacity: 0; } }
  .rk-rise { animation: rkRise .75s cubic-bezier(.22,1,.36,1) both; will-change: transform; }
  .rk-fade { animation: rkIn .55s cubic-bezier(.22,1,.36,1) both; }
  .rk-conf { position: absolute; top: 0; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: rkConf 2.6s ease-out both; }
  .rk-pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--optic); animation: rkPulse 2s ease-out .9s infinite; }
  @media (prefers-reduced-motion: reduce) { .rk-rise, .rk-fade, .rk-pulse::after { animation: none !important; } .rk-conf { display: none; } }

  html[data-theme="light"] .text-red-300, html[data-theme="light"] .hover\:text-red-300:hover { color: #b91c1c; }
  html[data-theme="light"] .row-actions button.danger:hover { color: #dc2626; }
  html[data-theme="light"] .text-amber-200 { color: #92400e; }
  html[data-theme="light"] .tour-card { box-shadow: 0 18px 50px rgba(11,42,36,.22); }

  :focus-visible { outline: 2px solid var(--optic); outline-offset: 2px; }
  input::placeholder { color: rgb(var(--fg) / .38); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgb(var(--fg) / .28); border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .pop, .live { animation: none !important; } .seg::before, .seg button { transition: none; } }
</style>

        <script>
            // Logout (header button on larger screens, sidebar button on phones): share.js signs the user out, then sends them to auth.html
            document.querySelectorAll(".js-logout").forEach(function (b) {
                b.addEventListener("click", function () {
                    if (!window.DinkShare) return;
                    b.disabled = true;
                    window.DinkShare.signOut().catch(function () { b.disabled = false; });
                });
            });

            // Phone sidebar: open with the menu button, close with X, the backdrop, Escape, a swipe left, or after choosing an item
            (function () {
                var panel = document.getElementById("navPanel"), bd = document.getElementById("navBackdrop"),
                    btn = document.getElementById("btnMenu"), mq = window.matchMedia("(max-width: 639px)"), isOpen = false, tx = null;
                function set(o, refocus) {
                    o = !!o && mq.matches;
                    if (o === isOpen) return;
                    isOpen = o;
                    panel.classList.toggle("open", o);
                    bd.classList.toggle("hidden", !o);
                    btn.setAttribute("aria-expanded", String(o));
                    btn.setAttribute("aria-label", o ? "Close menu" : "Open menu");
                    document.body.style.overflow = o ? "hidden" : "";
                    if (o) document.getElementById("navClose").focus({ preventScroll: true });
                    else if (refocus) btn.focus({ preventScroll: true });
                }
                btn.addEventListener("click", function () { set(!isOpen, true); });
                document.getElementById("navClose").addEventListener("click", function () { set(false, true); });
                bd.addEventListener("click", function () { set(false, true); });
                document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen) set(false, true); });
                // choosing an item closes the sidebar (the theme switch stays open so the change can be seen)
                panel.addEventListener("click", function (e) {
                    var b = e.target.closest("button");
                    if (b && b.id !== "navClose" && b.id !== "btnTheme" && !b.classList.contains("js-logout")) set(false, false);
                });
                panel.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
                panel.addEventListener("touchend", function (e) { if (tx !== null && tx - e.changedTouches[0].clientX > 60) set(false, true); tx = null; }, { passive: true });
                (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { if (!mq.matches) set(false, false); });
                // the guided tour opens the sidebar while it points at one of its buttons
                window.DinkNav = { sync: function (o) { set(o, false); } };
            })();
        </script>
    </body>
</html>
