<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>DinkHub | Live Open Play</title>
        <meta id="metaTheme" name="theme-color" content="#0b2a24" />
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/png" sizes="32x32"
            href="../icons/favicon-32.png" />
        <script>
try { var th = localStorage.getItem("dinkhub_theme") === "light" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", th); } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
tailwind.config = {
  theme: { extend: {
    colors: {
      court: { 900: "rgb(var(--c900) / <alpha-value>)", 800: "rgb(var(--c800) / <alpha-value>)", 700: "rgb(var(--c700) / <alpha-value>)", 600: "rgb(var(--c600) / <alpha-value>)" },
      optic: { DEFAULT: "rgb(var(--optic-rgb) / <alpha-value>)", dark: "rgb(var(--optic-dk-rgb) / <alpha-value>)" },
      white: "rgb(var(--fg) / <alpha-value>)",
    },
    fontFamily: { display: ['"Bricolage Grotesque"', "sans-serif"], body: ['"DM Sans"', "sans-serif"] },
  } },
};
</script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <style>
  :root { color-scheme: dark; --c900: 11 42 36; --c800: 15 58 50; --c700: 20 73 63; --c600: 27 94 81; --optic-rgb: 215 255 63; --optic-dk-rgb: 185 224 31; --fg: 255 255 255; --optic: rgb(var(--optic-rgb)); }
  html[data-theme="light"] { color-scheme: light; --c900: 243 247 238; --c800: 255 255 255; --c700: 232 240 227; --c600: 207 221 200; --optic-rgb: 23 96 79; --optic-dk-rgb: 17 77 63; --fg: 11 42 36; }
  body { background: rgb(var(--c900)); font-feature-settings: "tnum"; }
  #btnTheme i { position: absolute; transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .3s; }
  html[data-theme="dark"] #btnTheme .t-sun { transform: rotate(-90deg) scale(.3); opacity: 0; }
  html[data-theme="light"] #btnTheme .t-moon { transform: rotate(90deg) scale(.3); opacity: 0; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(215,255,63,.55); } 100% { box-shadow: 0 0 0 9px rgba(215,255,63,0); } }
  html[data-theme="light"] .live { animation-name: liveLight; }
  @keyframes liveLight { 0% { box-shadow: 0 0 0 0 rgba(23,96,79,.45); } 100% { box-shadow: 0 0 0 9px rgba(23,96,79,0); } }
  .live { animation: live 1.6s ease-out infinite; }

  /* The court: real proportions (20 x 44 ft), net in the middle, kitchens either side */
  .court { position: relative; aspect-ratio: 2 / 1; container-type: inline-size; }
  .court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot {
    position: absolute; transform: translate(-50%, -50%);
    width: 29%; display: flex; align-items: center; gap: 4px;
    padding: .4em .85em; border-radius: 999px; font-weight: 600; font-size: clamp(10.5px, 3.9cqw, 14px); line-height: 1.1;
  }
  .slot.filled { background: #0b2a24; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(215,255,63,.35); }
  .slot.open { border: 1.5px dashed rgba(255,255,255,.28); color: rgba(255,255,255,.4); justify-content: center; font-weight: 500; }
  .slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

  html[data-theme="light"] .text-amber-200 { color: #92400e; }
  :focus-visible { outline: 2px solid var(--optic); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgb(var(--fg) / .28); border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .live { animation: none !important; } }
</style>
    </head>
    <body id="top" class="font-body text-white min-h-screen antialiased">

        <header class="border-b border-white/10">
            <div
                class="mx-auto flex max-w-[1400px] items-center justify-between gap-2 px-4 pb-3 pt-[max(0.75rem,env(safe-area-inset-top))] sm:gap-3 sm:px-6">
                <div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-3">
                    <div
                        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-optic text-court-900"><i
                            class="fa-solid fa-table-tennis-paddle-ball"></i></div>
                    <div class="min-w-0 leading-tight">
                        <h1
                            class="truncate font-display text-xl font-extrabold">Dink<span
                                class="text-optic">Hub</span></h1>
                        <p class="truncate text-xs text-white/55">Open play</p>
                    </div>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                    <span id="liveBadge"
                        class="hidden h-10 items-center gap-2 rounded-xl border border-optic/50 px-3 text-sm font-bold text-optic"><span
                            class="live h-2.5 w-2.5 rounded-full bg-optic"></span>Live</span>
                    <span id="clock"
                        class="num hidden font-display text-lg font-semibold text-white/80 md:inline">--:--</span>
                    <button id="btnTheme" type="button" aria-pressed="false"
                        class="relative flex h-10 w-10 items-center justify-center overflow-hidden rounded-xl bg-white/5 hover:bg-white/10"
                        aria-label="Switch to light mode" title="Switch to light mode"><i
                            class="fa-solid fa-moon t-moon"></i><i
                            class="fa-solid fa-sun t-sun"></i></button>
                </div>
            </div>
        </header>

        <main id="app"
            class="mx-auto max-w-[1400px] px-4 pb-[max(2rem,env(safe-area-inset-bottom))] pt-5 sm:px-6 sm:pt-6">
            <div class="flex min-h-[50vh] flex-col items-center justify-center gap-3 text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-optic"></i>
                <p class="text-sm text-white/60">Loading the open play…</p>
            </div>
        </main>

        <footer class="mx-auto max-w-[1400px] px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] sm:px-6">
            <div class="border-t border-white/10 py-5 text-center text-sm text-white/50">
                <p id="expiryNote" class="mb-1 text-xs text-white/40"></p>
                Developed by <span class="font-semibold text-white/85">EM Development Solutions</span>
            </div>
        </footer>

        <script type="module" src="activity.js"></script>
    </body>
</html>
